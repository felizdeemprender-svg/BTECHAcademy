<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Fuentes del sistema (Windows) -->
  <dir>WINDOWSFONTDIR</dir>
  <!-- Fuentes del sistema (Linux / Firebase App Hosting / Cloud Run) -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <!-- Fuentes locales del proyecto (disponibles en todos los entornos) -->
  <dir prefix="default">fonts</dir>
  <cachedir prefix="default">fonts-cache</cachedir>
  <config>
    <rescan><int>30</int></rescan>
  </config>
</fontconfig>
